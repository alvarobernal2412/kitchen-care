# Imitates what Nginx Proxy Manager sends to the stack: Host = the public domain, X-Forwarded-Proto
# https. For tests, the client IP NPM would put in X-Forwarded-For is taken from the request header
# X-Test-Client-IP (when absent, NPM's usual $proxy_add_x_forwarded_for behaviour).
events {}
http {
	map $http_x_test_client_ip $sim_xff {
		default $http_x_test_client_ip;
		"" $proxy_add_x_forwarded_for;
	}
	server {
		listen 80;
		resolver 127.0.0.11 valid=5s ipv6=off;
		set $upstream "kitchen-care-proxy:80";
		client_max_body_size 6m;
		location / {
			proxy_pass http://$upstream;
			proxy_http_version 1.1;
			proxy_set_header Host kitchen.local;
			proxy_set_header X-Forwarded-For $sim_xff;
			proxy_set_header X-Forwarded-Proto https;
		}
	}
}
