# Shared proxy settings, included by every proxied location in nginx.conf.
proxy_pass http://$kc_upstream;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
# Overwrite (never append) with the resolved real client IP; the app runs with
# ADDRESS_HEADER=X-Forwarded-For and XFF_DEPTH=1, so it trusts exactly this one entry.
proxy_set_header X-Forwarded-For $remote_addr;
# NPM sets this to https; behind nothing (direct hit) fall back to our own scheme.
proxy_set_header X-Forwarded-Proto $kc_forwarded_proto;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
