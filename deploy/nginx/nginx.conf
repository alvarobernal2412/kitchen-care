# Internal reverse proxy for Kitchen Care Credits. No TLS here: Nginx Proxy Manager (NPM) terminates
# TLS and forwards to this container on port 80. This proxy exists so NPM has one stable upstream
# while deploy.sh switches between the app-blue and app-green containers.
#
# Generated by deploy.sh into /etc/nginx/kc (the `state/` directory on the host):
#   realip.conf   set_real_ip_from <NPM network subnet>;
#   upstream.conf set $kc_upstream "app-blue:3000";   (or app-green)

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 512;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	server_tokens off;
	access_log /dev/stdout;

	sendfile on;
	keepalive_timeout 65;

	# Real client IP. Only connections from the trusted NPM subnet may set it via X-Forwarded-For;
	# from anywhere else the header is ignored and $remote_addr stays the TCP peer.
	include /etc/nginx/kc/realip.conf;
	real_ip_header X-Forwarded-For;
	real_ip_recursive on;

	# Uploads: photos are at most 5 MB (app) plus multipart overhead; keep in step with the app's
	# BODY_SIZE_LIMIT=6M.
	client_max_body_size 6m;
	client_body_timeout 60s;
	client_header_timeout 20s;
	send_timeout 60s;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 512;
	gzip_proxied any;
	gzip_vary on;
	gzip_types text/plain text/css text/javascript application/javascript application/json
		application/manifest+json image/svg+xml;

	map $http_x_forwarded_proto $kc_forwarded_proto {
		default $scheme;
		https https;
		http http;
	}

	# Rate limits, keyed on the resolved real client IP.
	# Credential endpoints: only POSTs count (the map yields an empty key, i.e. no limit, for GETs).
	map $request_method $kc_auth_key {
		POST $binary_remote_addr;
		default "";
	}
	limit_req_zone $kc_auth_key zone=kc_auth:10m rate=10r/m;
	limit_req_zone $binary_remote_addr zone=kc_api:10m rate=120r/m;
	limit_req_zone $binary_remote_addr zone=kc_general:10m rate=20r/s;
	limit_req_status 429;

	# Docker's embedded DNS; a variable proxy_pass means nginx starts even if the app container is
	# not up yet (e.g. after a VM reboot) and picks up the colour switch on reload.
	resolver 127.0.0.11 valid=5s ipv6=off;

	server {
		listen 80 default_server;
		server_name _;

		include /etc/nginx/kc/upstream.conf;

		# Local liveness for the proxy's own container healthcheck; never proxied.
		location = /nginx-health {
			access_log off;
			default_type text/plain;
			return 200 "ok\n";
		}

		# Public health endpoints (uptime monitors): cheap, unlimited, not logged.
		location ~ ^/healthz(/ready)?$ {
			access_log off;
			include /etc/nginx/kc-static/proxy.conf;
		}

		# Login, signup and password reset: strict, POSTs only.
		location ~ ^/(login|signup|reset-password)/?$ {
			limit_req zone=kc_auth burst=5 nodelay;
			include /etc/nginx/kc-static/proxy.conf;
		}

		location /api/ {
			limit_req zone=kc_api burst=40 nodelay;
			include /etc/nginx/kc-static/proxy.conf;
		}

		# Fingerprinted build output: cache for a year. The app already sends this header; hide
		# its copy so the browser never sees it twice.
		location /_app/immutable/ {
			limit_req zone=kc_general burst=100 nodelay;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			include /etc/nginx/kc-static/proxy.conf;
		}

		# Public static assets: revalidate daily-ish. (Not /media: that is authenticated and is
		# never cached here; it falls through to the default location untouched.)
		location /icons/ {
			limit_req zone=kc_general burst=100 nodelay;
			proxy_hide_header Cache-Control;
			add_header Cache-Control "public, max-age=86400" always;
			include /etc/nginx/kc-static/proxy.conf;
		}

		location = /manifest.webmanifest {
			proxy_hide_header Cache-Control;
			add_header Cache-Control "public, max-age=3600" always;
			include /etc/nginx/kc-static/proxy.conf;
		}

		# Everything else (HTML, /media/*, __data.json): proxied as is, no caching rules.
		# Security headers (CSP, HSTS, ...) come from the app; none are added here.
		location / {
			limit_req zone=kc_general burst=60 nodelay;
			include /etc/nginx/kc-static/proxy.conf;
		}
	}
}
