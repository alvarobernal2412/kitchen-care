name: CI

# Runs on pull requests and on pushes to every branch except main. Pushes to main run these same
# jobs through deploy.yml (which calls this workflow), so they are not run twice.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # compose.dev.yml-compatible credentials for the throwaway Postgres service containers.
  DATABASE_URL: postgres://kitchen:kitchen@localhost:5432/kitchen
  TEST_DATABASE_URL: postgres://kitchen:kitchen@localhost:5432/kitchen

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - name: Deploy script tests
        run: |
          sh deploy/tests/test-lock.sh
          sh deploy/tests/test-update.sh

  e2e:
    name: Playwright e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Critical-path subset (tests tagged @smoke). The full suite is `npm run test:e2e`.
      - run: npm run test:e2e:smoke
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker build and smoke test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: kitchen-care-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Migrate and bootstrap an admin inside the image
        env:
          ADMIN_BOOTSTRAP_USERNAME: ci-admin
          ADMIN_BOOTSTRAP_PASSWORD: Ci-Smoke-Pass1!
        run: |
          docker run --rm --network host -e DATABASE_URL \
            -e ADMIN_BOOTSTRAP_USERNAME -e ADMIN_BOOTSTRAP_PASSWORD \
            kitchen-care-app:ci node scripts/bootstrap-admin.js
      - name: Run the container and check /healthz
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL -e ORIGIN=http://localhost:3000 \
            -e SESSION_SECRET=ci-smoke-session-secret-0123456789abcdef \
            -e APP_TIMEZONE=UTC \
            kitchen-care-app:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz | grep -q '"ok":true'; then ok=1; break; fi
            sleep 2
          done
          if [ "${ok:-0}" != 1 ]; then docker logs app; echo "::error::/healthz did not come up"; exit 1; fi
          curl -fsS http://localhost:3000/healthz/ready | grep -q '"ok":true'
          # The image's own HEALTHCHECK must turn healthy too.
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && exit 0
            sleep 3
          done
          docker logs app
          echo "::error::container never became healthy"
          exit 1
