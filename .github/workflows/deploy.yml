name: Deploy

# On every push to main (or by hand): run the CI jobs on GitHub-hosted runners, then deploy with a
# repo-scoped SELF-HOSTED runner that lives on the VPS and runs deploy/update.sh in the persistent
# clone there (git pull, build, blue/green switch). No SSH key and no deploy secrets in GitHub.
# This workflow never runs on pull_request, so untrusted code never reaches the self-hosted runner.
#
# The deploy job is skipped until the repository variable DEPLOY_ENABLED is 'true' (Settings >
# Secrets and variables > Actions > Variables), so merging before a runner is registered neither
# queues forever nor fails. See deploy/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy mid-flight; a newer push queues behind the running one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy on the VPS
    needs: ci
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, kitchen-care]
    timeout-minutes: 30
    environment: production
    steps:
      # No checkout step on purpose: the script updates the persistent clone on the VPS itself
      # (git fetch + reset), and a checkout into the runner's workspace would deploy nothing.
      - name: Update and deploy (deploy/update.sh)
        env:
          # Optional repository variable; the script lives in the clone, /opt/kitchen-care by default.
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          # The commit whose CI just passed: update.sh deploys exactly this one (it must be on
          # main) and skips it if a newer commit is already deployed. Never "whatever main is now".
          DEPLOY_SHA: ${{ github.sha }}
        run: '"${DEPLOY_DIR:-/opt/kitchen-care}/deploy/update.sh"'

      - name: Check the public URL
        if: ${{ vars.DOMAIN != '' }}
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          body=$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "https://$DOMAIN/healthz")
          printf '%s' "$body" | grep -q '"ok":true'
